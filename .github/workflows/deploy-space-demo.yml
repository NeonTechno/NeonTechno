name: Validate and deploy SVG ASCII space

on:
  pull_request:
    paths:
      - "space/**"
      - "space-ascii.svg"
      - "README.md"
      - ".github/workflows/deploy-space-demo.yml"
  push:
    branches: [main]
    paths:
      - "space/**"
      - "space-ascii.svg"
      - "README.md"
      - ".github/workflows/deploy-space-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ascii-space-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate SVG and tests
        working-directory: space
        run: |
          npm run check
          npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload SVG preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: space
      - name: Deploy SVG preview
        id: deployment
        uses: actions/deploy-pages@v4
